<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hola Mundo</title>
  <style>
    :root {
      --fondo: #f5f7fa;
      --texto: #1b2430;
      --suave: #5b6675;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #141a22;
        --texto: #eef2f7;
        --suave: #93a0b1;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--fondo);
      color: var(--texto);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2.5rem, 9vw, 5.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      font-size: 1.125rem;
      color: var(--suave);
    }
  </style>
</head>
<body>
  <h1>¡Hola, mundo!</h1>
  <p>Mi primera página en clase-ejemplo.</p>
</body>
</html>
